<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For Adi 💖</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg,#b6f0ff,#dff9ff);
      position:relative;
    }

    .container{
      text-align:center;
      z-index:2;
      padding:20px;
    }

    h1{
      font-size:42px;
      color:#0077aa;
      margin-bottom:25px;
      text-shadow:2px 2px 10px rgba(0,0,0,0.1);
    }

    .buttons{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    button{
      padding:14px 28px;
      border:none;
      border-radius:15px;
      font-size:20px;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
    }

    #yesBtn{
      background:#49d6ff;
      color:white;
    }

    #yesBtn:hover{
      transform:scale(1.1);
    }

    #noBtn{
      background:#ff8ca3;
      color:white;
      position:relative;
    }

    #message{
      margin-top:35px;
      font-size:34px;
      color:#005577;
      font-weight:bold;
      min-height:50px;
    }

    /* floating hearts */
    .heart{
      position:absolute;
      color:#ff5c8a;
      font-size:24px;
      animation:float 6s linear infinite;
      opacity:0.8;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
      }

      50%{
        opacity:1;
      }

      100%{
        transform:translateY(-120px) scale(1.4);
        opacity:0;
      }
    }

    /* popup animation */
    .show{
      animation:pop 0.6s ease;
    }

    @keyframes pop{
      0%{
        transform:scale(0);
      }

      100%{
        transform:scale(1);
      }
    }

    canvas{
      position:fixed;
      top:0;
      left:0;
      pointer-events:none;
    }

  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <div class="container">
    <h1>Will you plss forgive me?? 🥺🩵</h1>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😢</button>
    </div>

    <p id="message"></p>
  </div>

  <audio id="bgMusic">
    <source src="you're-love.mp3" type="audio/mp3">
  </audio>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");
    const music = document.getElementById("bgMusic");

    // YES BUTTON
    yesBtn.onclick = () => {
      typeMessage("I'm really sorry, Adi. I’m sorry kung napag-isip kita at naparamdam ko sa’yo na unimportant or neglected ka. That was never my intention, and I hate knowing that I made you feel that way. You mean so much to me, sobra. 🩵

Adi, you are very precious to me. You are valued, appreciated, and deeply loved by me, okay? You make my life more bearable and genuinely happier just by being here and by giving me the chance to pursue you. And honestly, if dumating man yung time na maging tayo, I know I’d be one of the happiest people in the world. 😊🩵");

      message.classList.add("show");

      // play music
      music.currentTime = 0;

      music.play().catch(() => {
        alert("Click again to enable music 💖");
      });

      startConfetti();
    };

    // NO BUTTON RUNS AWAY
    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 120);

      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    // TYPING EFFECT
    function typeMessage(text){
      message.innerHTML = "";
      let i = 0;

      const typing = setInterval(() => {
        message.innerHTML += text[i];
        i++;

        if(i >= text.length){
          clearInterval(typing);
        }
      },100);
    }

    // FLOATING HEARTS
    function createHeart(){
      const heart = document.createElement("div");

      heart.classList.add("heart");
      heart.innerHTML = "💖";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 20 + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      },6000);
    }

    setInterval(createHeart,400);

    // SIMPLE CONFETTI
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let pieces = [];

    function startConfetti(){

      for(let i=0;i<150;i++){
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 6 + 4,
          d: Math.random() * 100
        });
      }

      animateConfetti();
    }

    function animateConfetti(){

      ctx.clearRect(0,0,canvas.width,canvas.height);

      for(let i=0;i<pieces.length;i++){

        let p = pieces[i];

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2,false);
        ctx.fillStyle = "hsl(" + Math.random()*360 + ",100%,70%)";
        ctx.fill();

        p.y += 4;
        p.x += Math.sin(p.d);

        if(p.y > canvas.height){
          p.y = -10;
        }
      }

      requestAnimationFrame(animateConfetti);
    }

  </script>

</body>
</html>
